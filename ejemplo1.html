<script>

class usuario{
    constructor(nombre,Apellido,Sexo,Telefono,Soltero=Boolean){
        this.nombre=nombre;
        this.apellido=Apellido;

    }
}
    let personas=[];

    let persona3=new usuario("Lola","Chavez","Femenino","11 5893-7320",false);
    personas.push(persona1,persona2,persona3);
    const personasformateadas=personas.map(p=>({
        nombre:p.nombre,
        apellido:p.apellido,
        sexo:p.sexo,
        telefono:p.telefono,
        soltero:p.soltero ? "Si" : "No"
    }))
    console.table(personasformateadas);
